syntax="proto3";

package rta;

option go_package = "rta/proto/pb";

import "callgraph.proto";
import "ssa.proto";

// Need better name for this
message ReachableEntry {
    ssa.Function function = 1;
    bool address_taken = 2;
}

// RTAResult contains the results of an RTA analysis and the state
message RTAResult {
    callgraph.CallGraph call_graph = 1;

    // I am tempted to make this a map<string, ReachableEntry> so lookups are faster.
    repeated ReachableEntry reachable = 2;

    // Runtime types discovered by RTA. The value indicates whether the type is
    // inaccessible to reflection (the same meaning as in rta.Result.RuntimeTypes).
    map<string, bool> runtime_types = 3;
}

message ListOfFunctions {
    repeated ssa.Function functions = 1;
}

message ListOfCallSites {
    repeated ssa.CallSite call_sites = 1;
}

message MethodSummary {
    repeated ssa.Function provenance = 1;
    repeated ssa.Function functions_created = 2;
}

message RTAState {
    ssa.Function reflect_value_call = 1;
    map<string, ListOfFunctions> addr_taken_funcs_by_sig = 2;
    map<string, ListOfCallSites> dyn_call_sites = 3;
    map<string, MethodSummary> summary = 4;
    repeated ssa.Function roots = 5;

    // Invoke-mode call sites keyed by interface type string.
    map<string, ListOfCallSites> invoke_sites = 6;

    // Concrete and interface types known to RTA (string representations).
    repeated string concrete_types = 7;
    repeated string interface_types = 8;
}